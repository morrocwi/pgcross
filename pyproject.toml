[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgcross"
version = "0.2.0"
description = "PGCross — verified-reasoning, evidence-gated decision server"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "typer>=0.12",
    "numpy>=1.26",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.2.70"]
vllm = ["vllm>=0.4"]
rag = ["sentence-transformers>=2.7", "pypdf>=4"]
dev = ["pytest>=8", "pip-licenses>=4"]

[project.scripts]
pgcross = "pgcross.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/morrocwi/pgcross"
